<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betrayal App</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0b0806;
            background-image: radial-gradient(circle at center, #1f1008 0%, #050302 100%);
            color: #ffffff;
            font-family: 'Cinzel', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-card {
            background: rgba(15, 10, 7, 0.95);
            border: 2px solid #c5a059;
            box-shadow: 0 0 0 4px #1a100a, 0 0 25px rgba(0, 0, 0, 0.9);
            border-radius: 6px;
            padding: 35px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            font-weight: 900;
            color: #e6c687;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .subtitle {
            font-size: 10px;
            font-weight: 700;
            color: #c5a059;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-style: italic;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn-menu {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 18px;
            font-family: 'Cinzel', serif;
            font-size: 11px;
            font-weight: 900;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 4px;
            transition: transform 0.1s, filter 0.2s;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 4px 8px rgba(0,0,0,0.6);
        }

        .btn-menu:active {
            transform: scale(0.97);
        }

        /* BOTÓN SUPERVIVIENTES */
        .btn-survivors {
            background: linear-gradient(180deg, #1d5276 0%, #0e2a3e 100%);
            color: #ffffff;
            border: 1px solid #2980b9;
        }

        /* BOTÓN TRAIDOR */
        .btn-traitor {
            background: linear-gradient(180deg, #7b0000 0%, #3a0000 100%);
            color: #ffffff;
            border: 1px solid #c0392b;
        }

        /* BOTÓN MODO CAMPAÑA */
        .btn-campaign {
            background: linear-gradient(180deg, #1e5631 0%, #0c2b15 100%);
            color: #ffffff;
            border: 1px solid #27ae60;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>BETRAYAL APP</h1>
        <div class="subtitle">Selecciona tu rol en la partida:</div>

        <div class="btn-group">
            <a href="supervivientes.html" class="btn-menu btn-survivors">
                <span>🛡️</span> SUPERVIVIENTES
            </a>
            <a href="traidor.html" class="btn-menu btn-traitor">
                <span>🗡️</span> TOMO DEL TRAIDOR
            </a>
            <a href="campana.html" class="btn-menu btn-campaign">
                <span>📜</span> MODO CAMPAÑA
            </a>
        </div>
    </div>

</body>
</html>
