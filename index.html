<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betrayal at House on the Hill - Selector</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap');

        body {
            font-family: 'Cinzel', serif;
            background-color: #0d0705;
            background-image: radial-gradient(circle at center, #2c1a12 0%, #0d0705 100%);
            color: #e6c687;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .menu-container {
            width: 100%;
            max-width: 400px;
            background: rgba(13, 7, 5, 0.95);
            border: 3px double #c5a059;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            box-sizing: border-box;
        }

        h1 {
            font-size: 22px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px #000;
        }

        p {
            font-size: 13px;
            color: #d8ceb3;
            margin-bottom: 30px;
            font-style: italic;
        }

        .btn-role {
            display: block;
            width: 100%;
            padding: 16px 10px;
            margin-bottom: 15px;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            box-sizing: border-box;
            transition: transform 0.1s;
        }

        .btn-role:active {
            transform: scale(0.97);
        }

        .btn-survivor {
            background: linear-gradient(180deg, #1e3d59 0%, #0f1f2e 100%);
            color: #e0f2fe;
            border: 1.5px solid #38bdf8;
        }

        .btn-traitor {
            background: linear-gradient(180deg, #8b0000 0%, #4a0000 100%);
            color: #ffffff;
            border: 1.5px solid #c5a059;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1>Betrayal App</h1>
        <p>Selecciona tu rol en la partida:</p>

        <a href="supervivientes.html" class="btn-role btn-survivor">🛡️ Supervivientes</a>
        <a href="traidor.html" class="btn-role btn-traitor">🗡️ Tomo del Traidor</a>
    </div>

</body>
</html>
