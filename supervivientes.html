        48: { title: "Haunt #48: El Portal al Infierno", goal: "Pagar salud para cerrar las 3 runas del portal.", setup: "Demonios cruzan el portal.", actions: "Realicen el sacrificio de sellado en el Pentagrama." },
        49: { title: "Haunt #49: La Molicie de las Almas", goal: "Romper las Vasijas de Almas atacando la Sanidad del Traidor.", setup: "El Traidor consume almas.", actions: "Usen el Anillo o la Cripta como catalizador." },
        50: { title: "Haunt #50: Búsqueda del Tesoro (Escape)", goal: "Reunir las 3 llaves y escapar antes de 12 horas.", setup: "La casa se derrumba con cuenta regresiva.", actions: "Registren estancias con Conocimiento para hallar las llaves." }
    };

    function inicializarUI() {
        const roomSelect = document.getElementById('room-select');
        const omenSelect = document.getElementById('omen-select');
        const hauntSelect = document.getElementById('haunt-select');

        const rooms = Object.keys(HAUNT_MATRIX);
        roomSelect.innerHTML = '';
        rooms.forEach(room => {
            const opt = document.createElement('option');
            opt.value = room;
            opt.textContent = room;
            roomSelect.appendChild(opt);
        });

        const omens = Object.keys(HAUNT_MATRIX[rooms[0]]);
        omenSelect.innerHTML = '';
        omens.forEach(omen => {
            const opt = document.createElement('option');
            opt.value = omen;
            opt.textContent = OMEN_TRANSLATIONS[omen] || omen;
            omenSelect.appendChild(opt);
        });

        hauntSelect.innerHTML = '';
        for (let i = 1; i <= 50; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `Haunt #${i}${survivorHaunts[i] ? ': ' + survivorHaunts[i].title.split(': ')[1] : ''}`;
            hauntSelect.appendChild(opt);
        }

        calcularCruce();
    }

    function calcularCruce() {
        const room = document.getElementById('room-select').value;
        const omen = document.getElementById('omen-select').value;
        const hauntNumber = HAUNT_MATRIX[room][omen];

        document.getElementById('haunt-select').value = hauntNumber;
        cargarEscenario(hauntNumber);
    }

    function seleccionarEscenarioDirecto(num) {
        cargarEscenario(parseInt(num));
    }

    function cargarEscenario(num) {
        const data = survivorHaunts[num] || {
            title: `Haunt #${num}`,
            goal: "Consulte el libro Secretos para Sobrevivir impreso para este escenario.",
            setup: "Sin datos digitalizados para este folio.",
            actions: "Sin acciones cargadas."
        };

        document.getElementById('spoiler-cover').style.display = 'flex';
        document.getElementById('cover-title').innerText = data.title;
        
        document.getElementById('haunt-title').innerText = data.title;
        document.getElementById('haunt-goal').innerHTML = data.goal;
        document.getElementById('haunt-setup').innerHTML = data.setup;
        document.getElementById('haunt-actions').innerHTML = data.actions;
        document.getElementById('page-num').innerText = `Folio ${num}`;
    }

    function revelarFolio() {
        document.getElementById('spoiler-cover').style.display = 'none';
    }

    window.onload = inicializarUI;
</script>
</body>
</html>
